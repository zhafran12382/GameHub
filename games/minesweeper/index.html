<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper - GameHub</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .game-info {
      display: flex;
      gap: 2rem;
      justify-content: center;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .game-info .info-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.5rem 1.2rem;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      color: var(--neon-green);
      min-width: 80px;
      text-align: center;
    }
    .info-box .label {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .difficulty-selector {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .difficulty-selector .btn {
      font-size: 0.85rem;
      padding: 0.4rem 1rem;
    }
    .difficulty-selector .btn.active {
      background: var(--neon-blue);
      color: var(--bg-primary);
    }
    #grid {
      display: inline-grid;
      gap: 2px;
      background: var(--bg-primary);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 4px;
      user-select: none;
    }
    .cell {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.1s;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
    }
    .cell:hover:not(.revealed):not(.flagged) {
      background: #2a2a5a;
    }
    .cell.revealed {
      background: var(--bg-secondary);
      cursor: default;
      border-color: transparent;
    }
    .cell.flagged {
      background: rgba(255, 0, 170, 0.15);
      border-color: var(--neon-pink);
    }
    .cell.mine-exploded {
      background: rgba(255, 0, 0, 0.4);
      border-color: #ff0000;
    }
    .cell.mine-shown {
      background: rgba(255, 0, 170, 0.1);
    }
    .cell[data-count="1"] { color: var(--neon-blue); }
    .cell[data-count="2"] { color: var(--neon-green); }
    .cell[data-count="3"] { color: var(--neon-pink); }
    .cell[data-count="4"] { color: var(--neon-purple); }
    .cell[data-count="5"] { color: #ff4444; }
    .cell[data-count="6"] { color: #44ffff; }
    .cell[data-count="7"] { color: var(--neon-yellow); }
    .cell[data-count="8"] { color: #ffffff; }
    .status-message {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      margin-top: 1rem;
      min-height: 2rem;
      text-align: center;
    }
    @media (max-width: 600px) {
      .cell { width: 28px; height: 28px; font-size: 0.7rem; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="../../index.html" class="logo">Game<span>Hub</span></a>
    <a href="../../index.html" class="nav-back">← Back to Games</a>
  </nav>

  <div class="game-container">
    <div class="game-header">
      <h1>💣 Minesweeper</h1>
    </div>

    <div class="difficulty-selector">
      <button class="btn active" data-diff="easy">Easy</button>
      <button class="btn" data-diff="medium">Medium</button>
      <button class="btn" data-diff="hard">Hard</button>
    </div>

    <div class="game-info">
      <div class="info-box"><div class="label">Mines</div><div id="mineCount">10</div></div>
      <div class="info-box"><div class="label">Time</div><div id="timer">0</div></div>
      <div class="info-box"><div class="label">Flags</div><div id="flagCount">0</div></div>
    </div>

    <div class="game-area">
      <div id="grid"></div>
    </div>

    <div class="status-message" id="status"></div>

    <div class="game-controls">
      <button class="btn btn-primary" id="restartBtn">New Game</button>
    </div>
  </div>

  <script>
    const DIFFICULTIES = {
      easy:   { rows: 9,  cols: 9,  mines: 10 },
      medium: { rows: 16, cols: 16, mines: 40 },
      hard:   { rows: 16, cols: 30, mines: 99 }
    };

    let difficulty = 'easy';
    let rows, cols, totalMines;
    let board, revealed, flagged, mineLocations;
    let gameOver, gameWon, firstClick, flagCount, timerInterval, seconds;

    const gridEl = document.getElementById('grid');
    const mineCountEl = document.getElementById('mineCount');
    const timerEl = document.getElementById('timer');
    const flagCountEl = document.getElementById('flagCount');
    const statusEl = document.getElementById('status');
    const restartBtn = document.getElementById('restartBtn');

    document.querySelectorAll('.difficulty-selector .btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.difficulty-selector .btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        difficulty = btn.dataset.diff;
        initGame();
      });
    });
    restartBtn.addEventListener('click', initGame);

    function initGame() {
      const cfg = DIFFICULTIES[difficulty];
      rows = cfg.rows; cols = cfg.cols; totalMines = cfg.mines;
      board = Array.from({ length: rows }, () => Array(cols).fill(0));
      revealed = Array.from({ length: rows }, () => Array(cols).fill(false));
      flagged = Array.from({ length: rows }, () => Array(cols).fill(false));
      mineLocations = [];
      gameOver = false; gameWon = false; firstClick = true;
      flagCount = 0; seconds = 0;
      clearInterval(timerInterval);
      mineCountEl.textContent = totalMines;
      timerEl.textContent = '0';
      flagCountEl.textContent = '0';
      statusEl.textContent = '';
      statusEl.style.color = '';
      renderGrid();
    }

    function placeMines(safeR, safeC) {
      let placed = 0;
      while (placed < totalMines) {
        const r = Math.floor(Math.random() * rows);
        const c = Math.floor(Math.random() * cols);
        if (board[r][c] === -1) continue;
        if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
        board[r][c] = -1;
        mineLocations.push([r, c]);
        placed++;
      }
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (board[r][c] === -1) continue;
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc] === -1) count++;
            }
          }
          board[r][c] = count;
        }
      }
    }

    function renderGrid() {
      gridEl.innerHTML = '';
      gridEl.style.gridTemplateColumns = `repeat(${cols}, 36px)`;
      if (window.innerWidth <= 600) {
        gridEl.style.gridTemplateColumns = `repeat(${cols}, 28px)`;
      }
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.r = r;
          cell.dataset.c = c;
          cell.addEventListener('click', () => handleClick(r, c));
          cell.addEventListener('contextmenu', (e) => { e.preventDefault(); handleRightClick(r, c); });
          gridEl.appendChild(cell);
        }
      }
    }

    function getCell(r, c) {
      return gridEl.children[r * cols + c];
    }

    function handleClick(r, c) {
      if (gameOver || gameWon || flagged[r][c] || revealed[r][c]) return;
      if (firstClick) {
        firstClick = false;
        placeMines(r, c);
        timerInterval = setInterval(() => { seconds++; timerEl.textContent = seconds; }, 1000);
      }
      if (board[r][c] === -1) {
        revealMines(r, c);
        endGame(false);
        return;
      }
      floodFill(r, c);
      checkWin();
    }

    function handleRightClick(r, c) {
      if (gameOver || gameWon || revealed[r][c]) return;
      if (firstClick) return;
      flagged[r][c] = !flagged[r][c];
      const cell = getCell(r, c);
      if (flagged[r][c]) {
        cell.classList.add('flagged');
        cell.textContent = '🚩';
        flagCount++;
      } else {
        cell.classList.remove('flagged');
        cell.textContent = '';
        flagCount--;
      }
      flagCountEl.textContent = flagCount;
      mineCountEl.textContent = totalMines - flagCount;
    }

    function floodFill(r, c) {
      if (r < 0 || r >= rows || c < 0 || c >= cols) return;
      if (revealed[r][c] || flagged[r][c]) return;
      revealed[r][c] = true;
      const cell = getCell(r, c);
      cell.classList.add('revealed');
      if (board[r][c] > 0) {
        cell.textContent = board[r][c];
        cell.dataset.count = board[r][c];
        return;
      }
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          floodFill(r + dr, c + dc);
        }
      }
    }

    function revealMines(clickedR, clickedC) {
      mineLocations.forEach(([r, c]) => {
        const cell = getCell(r, c);
        if (r === clickedR && c === clickedC) {
          cell.classList.add('mine-exploded');
        } else {
          cell.classList.add('mine-shown');
        }
        cell.textContent = '💣';
        revealed[r][c] = true;
      });
    }

    function checkWin() {
      let unrevealedSafe = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (board[r][c] !== -1 && !revealed[r][c]) unrevealedSafe++;
        }
      }
      if (unrevealedSafe === 0) endGame(true);
    }

    function endGame(won) {
      clearInterval(timerInterval);
      if (won) {
        gameWon = true;
        statusEl.textContent = '🎉 You Win!';
        statusEl.style.color = 'var(--neon-green)';
      } else {
        gameOver = true;
        statusEl.textContent = '💥 Game Over!';
        statusEl.style.color = 'var(--neon-pink)';
      }
    }

    initGame();
  </script>
</body>
</html>
