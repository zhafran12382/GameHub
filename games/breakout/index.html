<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breakout - GameHub</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    canvas { background: var(--bg-primary); border-radius: 8px; }
    .score-board .label { color: var(--text-secondary); font-size: 0.9rem; }
    .game-area { padding: 0; overflow: hidden; }
    .instructions { color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.5rem; text-align: center; }
    .overlay-msg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(10,10,26,0.85); border-radius: 10px; z-index: 10;
    }
    .overlay-msg h2 { font-family: 'Orbitron', sans-serif; color: var(--neon-blue); font-size: 1.8rem; margin-bottom: 0.5rem; }
    .overlay-msg p { color: var(--text-secondary); margin-bottom: 1rem; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="../../index.html" class="logo">Game<span>Hub</span></a>
    <a href="../../index.html" class="nav-back">← Back to Games</a>
  </nav>

  <div class="game-container">
    <div class="game-header">
      <h1>🧱 Breakout</h1>
      <div class="score-board">
        <div><span class="label">Score</span> <span id="scoreEl">0</span></div>
        <div><span class="label">Lives</span> <span id="livesEl">3</span></div>
        <div><span class="label">Level</span> <span id="levelEl">1</span></div>
      </div>
    </div>

    <div class="game-area" id="gameArea">
      <canvas id="gameCanvas" width="700" height="500"></canvas>
      <div class="overlay-msg" id="overlay">
        <h2 id="overlayTitle">Breakout</h2>
        <p id="overlayText">Break all the bricks! Use mouse or ← → keys.</p>
        <button class="btn btn-primary" id="startBtn">Start Game</button>
      </div>
    </div>

    <div class="game-controls">
      <button class="btn" id="restartBtn">Restart</button>
    </div>
    <p class="instructions">Move paddle with mouse or ← / → arrow keys</p>
  </div>

  <script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayText = document.getElementById('overlayText');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const scoreEl = document.getElementById('scoreEl');
    const livesEl = document.getElementById('livesEl');
    const levelEl = document.getElementById('levelEl');
    const gameArea = document.getElementById('gameArea');

    const W = canvas.width, H = canvas.height;
    const PADDLE_W = 100, PADDLE_H = 14;
    const BALL_R = 7;
    const BRICK_ROWS = 6, BRICK_COLS = 10;
    const BRICK_W = (W - 40) / BRICK_COLS;
    const BRICK_H = 22;
    const BRICK_PAD = 3;
    const BRICK_TOP = 50;
    const BRICK_LEFT = 20;

    const ROW_COLORS = ['#ff00aa', '#ff4488', '#ffdd00', '#00ff88', '#00d4ff', '#aa00ff'];

    let paddleX, ballX, ballY, ballVX, ballVY;
    let score, lives, level, bricks, running, animId;
    let keysDown = {};

    function createBricks() {
      const b = [];
      for (let r = 0; r < BRICK_ROWS; r++) {
        b[r] = [];
        for (let c = 0; c < BRICK_COLS; c++) {
          b[r][c] = { alive: true, x: BRICK_LEFT + c * BRICK_W, y: BRICK_TOP + r * (BRICK_H + BRICK_PAD) };
        }
      }
      return b;
    }

    function resetBall() {
      ballX = W / 2;
      ballY = H - 50;
      const angle = -Math.PI / 4 + Math.random() * Math.PI / 2;
      const speed = 4 + level * 0.5;
      ballVX = speed * Math.sin(angle);
      ballVY = -speed * Math.cos(angle);
    }

    function init() {
      score = 0; lives = 3; level = 1;
      paddleX = W / 2 - PADDLE_W / 2;
      bricks = createBricks();
      resetBall();
      updateUI();
    }

    function updateUI() {
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      levelEl.textContent = level;
    }

    function allBricksCleared() {
      return bricks.every(row => row.every(b => !b.alive));
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Bricks
      ctx.shadowBlur = 0;
      for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
          if (!bricks[r][c].alive) continue;
          const bk = bricks[r][c];
          ctx.fillStyle = ROW_COLORS[r];
          ctx.shadowColor = ROW_COLORS[r];
          ctx.shadowBlur = 6;
          ctx.beginPath();
          ctx.roundRect(bk.x + BRICK_PAD / 2, bk.y, BRICK_W - BRICK_PAD, BRICK_H, 4);
          ctx.fill();
        }
      }

      // Paddle
      ctx.shadowColor = '#00d4ff';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#00d4ff';
      ctx.beginPath();
      ctx.roundRect(paddleX, H - 30, PADDLE_W, PADDLE_H, 6);
      ctx.fill();

      // Ball
      ctx.fillStyle = '#00ff88';
      ctx.shadowColor = '#00ff88';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(ballX, ballY, BALL_R, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function update() {
      // Keyboard
      if (keysDown['ArrowLeft']) paddleX -= 7;
      if (keysDown['ArrowRight']) paddleX += 7;
      paddleX = Math.max(0, Math.min(W - PADDLE_W, paddleX));

      ballX += ballVX;
      ballY += ballVY;

      // Wall collisions
      if (ballX - BALL_R <= 0 || ballX + BALL_R >= W) {
        ballVX *= -1;
        ballX = ballX - BALL_R <= 0 ? BALL_R : W - BALL_R;
      }
      if (ballY - BALL_R <= 0) {
        ballVY = Math.abs(ballVY);
        ballY = BALL_R;
      }

      // Paddle collision
      if (ballVY > 0 && ballY + BALL_R >= H - 30 && ballY + BALL_R <= H - 30 + PADDLE_H &&
          ballX >= paddleX && ballX <= paddleX + PADDLE_W) {
        const hit = (ballX - paddleX) / PADDLE_W - 0.5;
        const speed = Math.sqrt(ballVX * ballVX + ballVY * ballVY);
        const angle = hit * Math.PI * 0.7;
        ballVX = speed * Math.sin(angle);
        ballVY = -speed * Math.cos(angle);
        ballY = H - 30 - BALL_R;
      }

      // Brick collision
      for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
          const bk = bricks[r][c];
          if (!bk.alive) continue;
          const bx = bk.x + BRICK_PAD / 2, by = bk.y;
          const bw = BRICK_W - BRICK_PAD, bh = BRICK_H;
          if (ballX + BALL_R > bx && ballX - BALL_R < bx + bw &&
              ballY + BALL_R > by && ballY - BALL_R < by + bh) {
            bk.alive = false;
            score += (BRICK_ROWS - r) * 10;
            updateUI();
            // Determine bounce direction
            const overlapL = (ballX + BALL_R) - bx;
            const overlapR = (bx + bw) - (ballX - BALL_R);
            const overlapT = (ballY + BALL_R) - by;
            const overlapB = (by + bh) - (ballY - BALL_R);
            const minOverlap = Math.min(overlapL, overlapR, overlapT, overlapB);
            if (minOverlap === overlapT || minOverlap === overlapB) ballVY *= -1;
            else ballVX *= -1;

            if (allBricksCleared()) { nextLevel(); return; }
            return; // one brick per frame
          }
        }
      }

      // Ball lost
      if (ballY - BALL_R > H) {
        lives--;
        updateUI();
        if (lives <= 0) { endGame('Game Over'); return; }
        resetBall();
      }
    }

    function nextLevel() {
      level++;
      bricks = createBricks();
      resetBall();
      updateUI();
    }

    function loop() {
      if (!running) return;
      update();
      draw();
      animId = requestAnimationFrame(loop);
    }

    function startGame() {
      overlay.classList.add('hidden');
      running = true;
      init();
      loop();
    }

    function endGame(msg) {
      running = false;
      cancelAnimationFrame(animId);
      overlayTitle.textContent = msg;
      overlayText.textContent = `Score: ${score} | Level: ${level}`;
      startBtn.textContent = 'Play Again';
      overlay.classList.remove('hidden');
    }

    function restartGame() {
      running = false;
      cancelAnimationFrame(animId);
      init();
      draw();
      overlayTitle.textContent = 'Breakout';
      overlayText.textContent = 'Break all the bricks! Use mouse or ← → keys.';
      startBtn.textContent = 'Start Game';
      overlay.classList.remove('hidden');
    }

    gameArea.addEventListener('mousemove', function(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      paddleX = (e.clientX - rect.left) * scaleX - PADDLE_W / 2;
      paddleX = Math.max(0, Math.min(W - PADDLE_W, paddleX));
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault();
      keysDown[e.key] = true;
    });
    document.addEventListener('keyup', function(e) { keysDown[e.key] = false; });

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', restartGame);

    init();
    draw();
  })();
  </script>
</body>
</html>
