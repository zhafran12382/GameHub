<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hangman - GameHub</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .game-area {
      width: 100%;
      max-width: 700px;
      padding: 2rem;
      text-align: center;
    }
    .hangman-canvas {
      margin: 0 auto 1.5rem;
    }
    .hangman-canvas canvas {
      background: transparent;
    }
    .word-display {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      min-height: 3.5rem;
    }
    .word-display .letter-slot {
      width: 2.5rem;
      height: 3rem;
      border-bottom: 3px solid var(--neon-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--neon-green);
      text-transform: uppercase;
    }
    .word-display .letter-slot.revealed {
      border-bottom-color: var(--neon-green);
    }
    .word-display .letter-slot.wrong {
      color: var(--neon-pink);
      border-bottom-color: var(--neon-pink);
    }
    .category-hint {
      color: var(--neon-yellow);
      font-size: 1.1rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }
    .keyboard {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: center;
      max-width: 500px;
      margin: 1.5rem auto 0;
    }
    .key-btn {
      width: 2.5rem;
      height: 2.5rem;
      border: 2px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-primary);
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      transition: var(--transition);
      text-transform: uppercase;
    }
    .key-btn:hover:not(:disabled) {
      border-color: var(--neon-blue);
      color: var(--neon-blue);
      box-shadow: var(--shadow-neon);
    }
    .key-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .key-btn.correct {
      border-color: var(--neon-green);
      color: var(--neon-green);
      background: rgba(0,255,136,0.1);
    }
    .key-btn.wrong {
      border-color: var(--neon-pink);
      color: var(--neon-pink);
      background: rgba(255,0,170,0.1);
    }
    .stats {
      display: flex;
      gap: 2rem;
      justify-content: center;
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }
    .stats .label { color: var(--text-secondary); }
    .stats .value {
      color: var(--neon-green);
      font-weight: 700;
      font-family: 'Orbitron', sans-serif;
    }
    .message {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      margin: 1rem 0;
      min-height: 2rem;
    }
    .message.win { color: var(--neon-green); }
    .message.lose { color: var(--neon-pink); }
    @media (max-width: 480px) {
      .key-btn { width: 2rem; height: 2rem; font-size: 0.7rem; }
      .word-display .letter-slot { width: 1.8rem; height: 2.2rem; font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="../../index.html" class="logo">Game<span>Hub</span></a>
    <a href="../../index.html" class="nav-back">← Back to Games</a>
  </nav>

  <div class="game-container">
    <div class="game-header">
      <h1>📝 Hangman</h1>
      <div class="stats">
        <div><span class="label">Wins: </span><span class="value" id="wins">0</span></div>
        <div><span class="label">Losses: </span><span class="value" id="losses">0</span></div>
        <div><span class="label">Wrong: </span><span class="value" id="wrongCount">0</span><span class="label"> / 6</span></div>
      </div>
    </div>

    <div class="game-area">
      <div class="hangman-canvas">
        <canvas id="hangmanCanvas" width="200" height="220"></canvas>
      </div>
      <div class="category-hint" id="categoryHint"></div>
      <div class="word-display" id="wordDisplay"></div>
      <div class="message" id="message"></div>
      <div class="keyboard" id="keyboard"></div>
    </div>

    <div class="game-controls">
      <button class="btn btn-primary" id="newGameBtn">New Word</button>
    </div>
  </div>

  <script>
    const WORDS = {
      'Animals': ['elephant', 'giraffe', 'penguin', 'dolphin', 'chameleon', 'kangaroo', 'octopus', 'butterfly', 'cheetah', 'platypus'],
      'Countries': ['australia', 'brazil', 'germany', 'japan', 'morocco', 'canada', 'thailand', 'portugal', 'argentina', 'iceland'],
      'Fruits': ['pineapple', 'strawberry', 'blueberry', 'watermelon', 'pomegranate', 'dragonfruit', 'raspberry', 'tangerine', 'coconut', 'mango'],
      'Technology': ['algorithm', 'database', 'javascript', 'keyboard', 'software', 'internet', 'bluetooth', 'processor', 'terminal', 'compiler'],
      'Sports': ['basketball', 'volleyball', 'badminton', 'swimming', 'skateboard', 'snowboard', 'wrestling', 'archery', 'gymnastics', 'baseball'],
      'Science': ['molecule', 'electron', 'gravity', 'photosynthesis', 'telescope', 'chromosome', 'magnetism', 'asteroid', 'nucleus', 'evolution']
    };

    const categories = Object.keys(WORDS);
    let currentWord = '';
    let currentCategory = '';
    let guessedLetters = new Set();
    let wrongGuesses = 0;
    let wins = 0;
    let losses = 0;
    let gameOver = false;

    const canvas = document.getElementById('hangmanCanvas');
    const ctx = canvas.getContext('2d');

    function drawHangman(step) {
      ctx.strokeStyle = '#00d4ff';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      switch(step) {
        case 1: // head
          ctx.beginPath();
          ctx.arc(100, 70, 20, 0, Math.PI * 2);
          ctx.stroke();
          break;
        case 2: // body
          ctx.beginPath();
          ctx.moveTo(100, 90);
          ctx.lineTo(100, 150);
          ctx.stroke();
          break;
        case 3: // left arm
          ctx.beginPath();
          ctx.moveTo(100, 110);
          ctx.lineTo(65, 130);
          ctx.stroke();
          break;
        case 4: // right arm
          ctx.beginPath();
          ctx.moveTo(100, 110);
          ctx.lineTo(135, 130);
          ctx.stroke();
          break;
        case 5: // left leg
          ctx.beginPath();
          ctx.moveTo(100, 150);
          ctx.lineTo(70, 190);
          ctx.stroke();
          break;
        case 6: // right leg
          ctx.strokeStyle = '#ff00aa';
          ctx.beginPath();
          ctx.moveTo(100, 150);
          ctx.lineTo(130, 190);
          ctx.stroke();
          break;
      }
    }

    function drawGallows() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#2a2a5a';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      // base
      ctx.beginPath();
      ctx.moveTo(20, 210);
      ctx.lineTo(180, 210);
      ctx.stroke();
      // pole
      ctx.beginPath();
      ctx.moveTo(50, 210);
      ctx.lineTo(50, 20);
      ctx.stroke();
      // top
      ctx.beginPath();
      ctx.moveTo(50, 20);
      ctx.lineTo(100, 20);
      ctx.stroke();
      // rope
      ctx.beginPath();
      ctx.moveTo(100, 20);
      ctx.lineTo(100, 50);
      ctx.stroke();
    }

    function pickWord() {
      currentCategory = categories[Math.floor(Math.random() * categories.length)];
      const wordList = WORDS[currentCategory];
      currentWord = wordList[Math.floor(Math.random() * wordList.length)];
    }

    function renderWord() {
      const display = document.getElementById('wordDisplay');
      display.innerHTML = '';
      for (const ch of currentWord) {
        const slot = document.createElement('div');
        slot.className = 'letter-slot';
        if (guessedLetters.has(ch)) {
          slot.textContent = ch;
          slot.classList.add('revealed');
        }
        display.appendChild(slot);
      }
    }

    function renderKeyboard() {
      const kb = document.getElementById('keyboard');
      kb.innerHTML = '';
      for (let i = 0; i < 26; i++) {
        const letter = String.fromCharCode(97 + i);
        const btn = document.createElement('button');
        btn.className = 'key-btn';
        btn.textContent = letter;
        if (guessedLetters.has(letter)) {
          btn.disabled = true;
          btn.classList.add(currentWord.includes(letter) ? 'correct' : 'wrong');
        }
        if (!gameOver) {
          btn.addEventListener('click', () => guessLetter(letter));
        } else {
          btn.disabled = true;
        }
        kb.appendChild(btn);
      }
    }

    function guessLetter(letter) {
      if (gameOver || guessedLetters.has(letter)) return;
      guessedLetters.add(letter);

      if (!currentWord.includes(letter)) {
        wrongGuesses++;
        drawHangman(wrongGuesses);
        document.getElementById('wrongCount').textContent = wrongGuesses;
      }

      renderWord();
      renderKeyboard();
      checkGameState();
    }

    function checkGameState() {
      const msg = document.getElementById('message');
      const allRevealed = [...currentWord].every(ch => guessedLetters.has(ch));

      if (allRevealed) {
        gameOver = true;
        wins++;
        document.getElementById('wins').textContent = wins;
        msg.textContent = '🎉 You Won!';
        msg.className = 'message win';
        renderKeyboard();
      } else if (wrongGuesses >= 6) {
        gameOver = true;
        losses++;
        document.getElementById('losses').textContent = losses;
        msg.textContent = `💀 Game Over! The word was "${currentWord}"`;
        msg.className = 'message lose';
        // Reveal word
        const slots = document.querySelectorAll('.letter-slot');
        [...currentWord].forEach((ch, i) => {
          if (!guessedLetters.has(ch)) {
            slots[i].textContent = ch;
            slots[i].classList.add('wrong');
          }
        });
        renderKeyboard();
      }
    }

    function newGame() {
      guessedLetters.clear();
      wrongGuesses = 0;
      gameOver = false;
      document.getElementById('wrongCount').textContent = '0';
      document.getElementById('message').textContent = '';
      document.getElementById('message').className = 'message';
      pickWord();
      drawGallows();
      document.getElementById('categoryHint').textContent = `Category: ${currentCategory}`;
      renderWord();
      renderKeyboard();
    }

    document.getElementById('newGameBtn').addEventListener('click', newGame);

    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key.length === 1 && key >= 'a' && key <= 'z') {
        guessLetter(key);
      }
    });

    newGame();
  </script>
</body>
</html>
