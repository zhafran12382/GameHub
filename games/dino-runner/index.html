<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dino Runner - GameHub</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .game-area { padding: 0; overflow: hidden; }
    canvas { border-radius: 10px; }
    .game-header .score-board { font-size: 1.1rem; gap: 1.5rem; flex-wrap: wrap; }
    .instructions { color: var(--text-secondary); font-size: 0.95rem; margin-top: 1rem; text-align: center; max-width: 600px; }
    .instructions kbd { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 4px; padding: 0.1rem 0.4rem; font-family: 'Rajdhani', sans-serif; color: var(--neon-yellow); }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="../../index.html" class="logo">Game<span>Hub</span></a>
    <a href="../../index.html" class="nav-back">← Back to Games</a>
  </nav>

  <div class="game-container">
    <div class="game-header">
      <h1>🦕 Dino Runner</h1>
      <div class="score-board">
        <div>Score: <span id="score">0</span></div>
        <div>High Score: <span id="highScore">0</span></div>
        <div>Speed: <span id="speed">1.0</span>x</div>
      </div>
    </div>
    <div class="game-area">
      <canvas id="gameCanvas" width="800" height="250"></canvas>
    </div>
    <div class="game-controls">
      <button class="btn btn-primary" id="startBtn">Start Game</button>
      <button class="btn" id="restartBtn" style="display:none;">Restart</button>
    </div>
    <div class="instructions">
      <kbd>Space</kbd> or <kbd>Click</kbd> to jump · <kbd>↓</kbd> to duck · Avoid obstacles and survive!
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const speedEl = document.getElementById('speed');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');

let highScore = parseInt(localStorage.getItem('dinoHighScore')) || 0;
highScoreEl.textContent = highScore;

const GROUND_Y = 200;
const GRAVITY = 0.6;
const JUMP_FORCE = -12;
const CANVAS_W = 800;
const CANVAS_H = 250;

let dino, obstacles, clouds, stars, gameSpeed, score, frameCount, gameRunning, gameOver, dayNightCycle;

function initGame() {
  dino = { x: 60, y: GROUND_Y, w: 40, h: 44, vy: 0, ducking: false, jumpCount: 0, frame: 0 };
  obstacles = [];
  clouds = [];
  stars = [];
  gameSpeed = 4;
  score = 0;
  frameCount = 0;
  gameRunning = false;
  gameOver = false;
  dayNightCycle = 0;
  for (let i = 0; i < 20; i++) stars.push({ x: Math.random() * CANVAS_W, y: Math.random() * 120, s: Math.random() * 2 + 1 });
  for (let i = 0; i < 3; i++) clouds.push({ x: Math.random() * CANVAS_W, y: 30 + Math.random() * 60, w: 60 + Math.random() * 40 });
}

function spawnObstacle() {
  const minGap = Math.max(80, 160 - gameSpeed * 5);
  if (obstacles.length > 0) {
    const last = obstacles[obstacles.length - 1];
    if (last.x > CANVAS_W - minGap) return;
  }
  const r = Math.random();
  if (r < 0.6) {
    const count = Math.random() < 0.3 ? 2 : 1;
    const h = 30 + Math.random() * 20;
    obstacles.push({ type: 'cactus', x: CANVAS_W + 20, y: GROUND_Y + 44 - h, w: 18 * count, h: h, counted: false });
  } else {
    const birdY = Math.random() < 0.5 ? GROUND_Y + 10 : GROUND_Y - 20;
    obstacles.push({ type: 'bird', x: CANVAS_W + 20, y: birdY, w: 34, h: 22, frame: 0, counted: false });
  }
}

function getSkyColor() {
  const t = (Math.sin(dayNightCycle) + 1) / 2;
  const r = Math.round(10 + t * 10);
  const g = Math.round(10 + t * 15);
  const b = Math.round(26 + t * 30);
  return `rgb(${r},${g},${b})`;
}

function isNight() { return Math.sin(dayNightCycle) < -0.3; }

function drawDino() {
  ctx.save();
  const bobble = dino.y >= GROUND_Y ? Math.sin(frameCount * 0.3) * 2 : 0;
  const dx = dino.x;
  const dy = dino.y + bobble;
  const h = dino.ducking ? 24 : 44;
  const w = dino.ducking ? 50 : 40;
  const actualY = dino.ducking ? GROUND_Y + 20 : dy;

  // Body
  ctx.fillStyle = '#00ff88';
  ctx.shadowColor = '#00ff88';
  ctx.shadowBlur = 8;
  ctx.fillRect(dx + 5, actualY, w - 10, h);

  // Head
  ctx.fillRect(dx + w - 18, actualY - (dino.ducking ? 4 : 12), 18, dino.ducking ? 12 : 16);

  // Eye
  ctx.fillStyle = '#ff0055';
  ctx.shadowBlur = 4;
  ctx.shadowColor = '#ff0055';
  ctx.fillRect(dx + w - 8, actualY - (dino.ducking ? 1 : 8), 4, 4);

  // Legs
  ctx.fillStyle = '#00ff88';
  ctx.shadowBlur = 0;
  if (dino.y >= GROUND_Y) {
    const legOff = Math.sin(frameCount * 0.4) * 6;
    ctx.fillRect(dx + 10, actualY + h, 6, 8 + legOff);
    ctx.fillRect(dx + w - 20, actualY + h, 6, 8 - legOff);
  } else {
    ctx.fillRect(dx + 10, actualY + h, 6, 6);
    ctx.fillRect(dx + w - 20, actualY + h, 6, 6);
  }
  ctx.restore();
}

function drawCactus(obs) {
  ctx.save();
  ctx.fillStyle = '#ff00aa';
  ctx.shadowColor = '#ff00aa';
  ctx.shadowBlur = 6;
  const cx = obs.x + obs.w / 2;
  ctx.fillRect(cx - 5, obs.y, 10, obs.h);
  if (obs.w > 20) {
    ctx.fillRect(cx - 18, obs.y + 8, 12, 6);
    ctx.fillRect(cx - 18, obs.y + 8, 6, 16);
    ctx.fillRect(cx + 6, obs.y + 14, 12, 6);
    ctx.fillRect(cx + 12, obs.y + 6, 6, 14);
  } else {
    ctx.fillRect(cx - 14, obs.y + 10, 10, 5);
    ctx.fillRect(cx - 14, obs.y + 6, 5, 9);
    ctx.fillRect(cx + 4, obs.y + 15, 10, 5);
    ctx.fillRect(cx + 9, obs.y + 10, 5, 10);
  }
  ctx.restore();
}

function drawBird(obs) {
  ctx.save();
  ctx.fillStyle = '#ffdd00';
  ctx.shadowColor = '#ffdd00';
  ctx.shadowBlur = 6;
  ctx.fillRect(obs.x + 4, obs.y + 6, 26, 10);
  ctx.fillRect(obs.x + 24, obs.y + 4, 10, 8);
  // Wings flap
  const wingY = Math.sin(frameCount * 0.3) * 8;
  ctx.fillRect(obs.x + 8, obs.y + wingY, 16, 4);
  ctx.restore();
}

function drawGround() {
  ctx.strokeStyle = isNight() ? '#2a2a5a' : '#3a3a6a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y + 52);
  ctx.lineTo(CANVAS_W, GROUND_Y + 52);
  ctx.stroke();
  ctx.fillStyle = isNight() ? '#1a1a3e' : '#22224a';
  for (let i = 0; i < 30; i++) {
    const bx = ((i * 40 - frameCount * gameSpeed * 0.5) % (CANVAS_W + 40) + CANVAS_W + 40) % (CANVAS_W + 40);
    ctx.fillRect(bx, GROUND_Y + 54 + (i % 3) * 4, 12 + (i % 5) * 3, 2);
  }
}

function drawClouds() {
  ctx.fillStyle = isNight() ? 'rgba(100,100,160,0.15)' : 'rgba(100,100,180,0.2)';
  clouds.forEach(c => {
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.w / 2, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x - 15, c.y + 5, c.w / 3, 8, 0, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawStars() {
  if (!isNight()) return;
  ctx.fillStyle = '#ffffff';
  const alpha = Math.max(0, -Math.sin(dayNightCycle) - 0.3) * 1.5;
  ctx.globalAlpha = Math.min(1, alpha);
  stars.forEach(s => {
    const twinkle = Math.sin(frameCount * 0.05 + s.x) > 0 ? 1 : 0.4;
    ctx.globalAlpha = Math.min(1, alpha * twinkle);
    ctx.fillRect(s.x, s.y, s.s, s.s);
  });
  ctx.globalAlpha = 1;
}

function checkCollision(a, b) {
  const pad = 6;
  const aH = dino.ducking ? 24 : 44;
  const aY = dino.ducking ? GROUND_Y + 20 : a.y;
  return a.x + pad < b.x + b.w && a.x + a.w - pad > b.x && aY + pad < b.y + b.h && aY + aH - pad > b.y;
}

function update() {
  if (!gameRunning || gameOver) return;
  frameCount++;
  dayNightCycle += 0.001;

  // Dino physics
  dino.vy += GRAVITY;
  dino.y += dino.vy;
  if (dino.y >= GROUND_Y) {
    dino.y = GROUND_Y;
    dino.vy = 0;
    dino.jumpCount = 0;
  }

  // Score
  score = Math.floor(frameCount / 6);
  gameSpeed = 4 + score / 200;
  scoreEl.textContent = score;
  speedEl.textContent = (gameSpeed / 4).toFixed(1);

  // Spawn obstacles
  if (frameCount % Math.max(30, 80 - Math.floor(gameSpeed * 3)) === 0) spawnObstacle();

  // Move obstacles
  obstacles.forEach(o => {
    o.x -= gameSpeed;
    if (o.type === 'bird') o.frame++;
  });
  obstacles = obstacles.filter(o => o.x + o.w > -20);

  // Move clouds
  clouds.forEach(c => {
    c.x -= gameSpeed * 0.2;
    if (c.x + c.w < 0) { c.x = CANVAS_W + 60; c.y = 30 + Math.random() * 60; }
  });

  // Collision
  for (const obs of obstacles) {
    if (checkCollision(dino, obs)) {
      gameOver = true;
      gameRunning = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('dinoHighScore', highScore);
        highScoreEl.textContent = highScore;
      }
      restartBtn.style.display = '';
      return;
    }
  }
}

function draw() {
  // Sky
  ctx.fillStyle = getSkyColor();
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  drawStars();
  drawClouds();
  drawGround();

  obstacles.forEach(o => {
    if (o.type === 'cactus') drawCactus(o);
    else drawBird(o);
  });

  drawDino();

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    ctx.font = "bold 36px 'Orbitron', sans-serif";
    ctx.fillStyle = '#ff00aa';
    ctx.shadowColor = '#ff00aa';
    ctx.shadowBlur = 15;
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', CANVAS_W / 2, CANVAS_H / 2 - 10);
    ctx.font = "20px 'Rajdhani', sans-serif";
    ctx.fillStyle = '#e0e0ff';
    ctx.shadowBlur = 0;
    ctx.fillText('Score: ' + score, CANVAS_W / 2, CANVAS_H / 2 + 25);
  }

  if (!gameRunning && !gameOver) {
    ctx.font = "22px 'Rajdhani', sans-serif";
    ctx.fillStyle = '#8888aa';
    ctx.textAlign = 'center';
    ctx.fillText('Press Start or Space to play', CANVAS_W / 2, CANVAS_H / 2);
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function jump() {
  if (dino.jumpCount < 2) {
    dino.vy = JUMP_FORCE;
    dino.jumpCount++;
    dino.ducking = false;
  }
}

function startGame() {
  initGame();
  gameRunning = true;
  gameOver = false;
  startBtn.style.display = 'none';
  restartBtn.style.display = 'none';
}

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (!gameRunning && !gameOver) startGame();
    else if (gameOver) startGame();
    else jump();
  }
  if (e.code === 'ArrowUp') { e.preventDefault(); if (gameRunning) jump(); }
  if (e.code === 'ArrowDown') { e.preventDefault(); if (gameRunning) dino.ducking = true; }
});

document.addEventListener('keyup', e => {
  if (e.code === 'ArrowDown') dino.ducking = false;
});

canvas.addEventListener('click', () => {
  if (!gameRunning && !gameOver) startGame();
  else if (gameOver) startGame();
  else jump();
});

initGame();
gameLoop();
</script>
</body>
</html>
