<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake - GameHub</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .game-area canvas {
      border-radius: 8px;
      background: #0a0a1a;
    }
    .stats {
      display: flex;
      gap: 2rem;
      justify-content: center;
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }
    .stats .label {
      color: var(--text-secondary);
    }
    .stats .value {
      color: var(--neon-green);
      font-weight: 700;
      font-family: 'Orbitron', sans-serif;
    }
    .instructions {
      color: var(--text-secondary);
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
    }
    .overlay {
      display: none;
    }
    .overlay.active {
      display: flex;
    }
    .final-score {
      font-size: 2.5rem;
      color: var(--neon-green);
      font-family: 'Orbitron', sans-serif;
      margin: 0.5rem 0 1rem;
    }
    @media (max-width: 480px) {
      .game-area { padding: 0.5rem; }
      .touch-controls {
        display: grid;
        grid-template-areas: ". up ." "left . right" ". down .";
        gap: 0.5rem;
        margin-top: 1rem;
        justify-content: center;
      }
      .touch-controls button {
        width: 56px; height: 56px;
        font-size: 1.5rem;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-primary);
        cursor: pointer;
      }
      .touch-controls .up { grid-area: up; }
      .touch-controls .down { grid-area: down; }
      .touch-controls .left { grid-area: left; }
      .touch-controls .right { grid-area: right; }
    }
    @media (min-width: 481px) {
      .touch-controls { display: none; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="../../index.html" class="logo">Game<span>Hub</span></a>
    <a href="../../index.html" class="nav-back">← Back to Games</a>
  </nav>

  <div class="game-container">
    <div class="game-header">
      <h1>🐍 Snake</h1>
      <div class="stats">
        <div><span class="label">Score: </span><span class="value" id="score">0</span></div>
        <div><span class="label">High Score: </span><span class="value" id="highScore">0</span></div>
        <div><span class="label">Speed: </span><span class="value" id="speed">1</span></div>
      </div>
    </div>

    <div class="game-area">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <div class="touch-controls">
      <button class="up" onclick="setDir(0,-1)">▲</button>
      <button class="left" onclick="setDir(-1,0)">◄</button>
      <button class="right" onclick="setDir(1,0)">►</button>
      <button class="down" onclick="setDir(0,1)">▼</button>
    </div>

    <div class="game-controls">
      <button class="btn btn-primary" id="startBtn">Start Game</button>
      <button class="btn" id="pauseBtn" disabled>Pause</button>
    </div>
    <p class="instructions">Use arrow keys to control the snake. Eat food to grow and score points!</p>
  </div>

  <div class="overlay" id="gameOverOverlay">
    <div class="modal">
      <h2>Game Over!</h2>
      <div class="final-score" id="finalScore">0</div>
      <p>Press the button to try again.</p>
      <button class="btn btn-primary" id="restartBtn">Play Again</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const GRID = 20;
    const COLS = canvas.width / GRID;
    const ROWS = canvas.height / GRID;

    let snake, direction, nextDirection, food, score, highScore, speed, gameLoop, paused, running;

    highScore = parseInt(localStorage.getItem('snake_highscore')) || 0;
    document.getElementById('highScore').textContent = highScore;

    function init() {
      snake = [{ x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) }];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      speed = 1;
      paused = false;
      running = true;
      updateUI();
      spawnFood();
      draw();
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, getInterval());
      document.getElementById('pauseBtn').disabled = false;
      document.getElementById('pauseBtn').textContent = 'Pause';
      document.getElementById('gameOverOverlay').classList.remove('active');
    }

    function getInterval() {
      return Math.max(60, 150 - (speed - 1) * 10);
    }

    function spawnFood() {
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    function tick() {
      if (paused || !running) return;
      direction = { ...nextDirection };
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS || snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        if (score % 50 === 0) {
          speed++;
          clearInterval(gameLoop);
          gameLoop = setInterval(tick, getInterval());
        }
        spawnFood();
      } else {
        snake.pop();
      }

      updateUI();
      draw();
    }

    function draw() {
      ctx.fillStyle = '#0a0a1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines
      ctx.strokeStyle = 'rgba(42, 42, 90, 0.3)';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= COLS; i++) {
        ctx.beginPath(); ctx.moveTo(i * GRID, 0); ctx.lineTo(i * GRID, canvas.height); ctx.stroke();
      }
      for (let i = 0; i <= ROWS; i++) {
        ctx.beginPath(); ctx.moveTo(0, i * GRID); ctx.lineTo(canvas.width, i * GRID); ctx.stroke();
      }

      // Snake
      snake.forEach((seg, i) => {
        const gradient = ctx.createRadialGradient(
          seg.x * GRID + GRID / 2, seg.y * GRID + GRID / 2, 2,
          seg.x * GRID + GRID / 2, seg.y * GRID + GRID / 2, GRID / 2
        );
        if (i === 0) {
          gradient.addColorStop(0, '#00ff88');
          gradient.addColorStop(1, '#00cc66');
        } else {
          gradient.addColorStop(0, '#00dd77');
          gradient.addColorStop(1, '#009955');
        }
        ctx.fillStyle = gradient;
        ctx.shadowColor = '#00ff88';
        ctx.shadowBlur = i === 0 ? 10 : 4;
        ctx.beginPath();
        ctx.roundRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2, 4);
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // Food
      ctx.fillStyle = '#ff00aa';
      ctx.shadowColor = '#ff00aa';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function updateUI() {
      document.getElementById('score').textContent = score;
      document.getElementById('speed').textContent = speed;
    }

    function gameOver() {
      running = false;
      clearInterval(gameLoop);
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('snake_highscore', highScore);
        document.getElementById('highScore').textContent = highScore;
      }
      document.getElementById('finalScore').textContent = score;
      document.getElementById('gameOverOverlay').classList.add('active');
      document.getElementById('pauseBtn').disabled = true;
    }

    function setDir(x, y) {
      if (direction.x !== -x || direction.y !== -y) {
        nextDirection = { x, y };
      }
    }

    document.addEventListener('keydown', e => {
      const map = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0] };
      if (map[e.key]) {
        e.preventDefault();
        setDir(map[e.key][0], map[e.key][1]);
      }
    });

    document.getElementById('startBtn').addEventListener('click', init);
    document.getElementById('restartBtn').addEventListener('click', init);
    document.getElementById('pauseBtn').addEventListener('click', () => {
      if (!running) return;
      paused = !paused;
      document.getElementById('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
    });

    // Initial draw
    snake = [{ x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) }];
    food = { x: 5, y: 5 };
    score = 0; speed = 1;
    draw();
  </script>
</body>
</html>
